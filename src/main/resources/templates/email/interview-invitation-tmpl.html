<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: email(~{::title}, ~{::content})}">
<head>
    <title th:text="|[${companyName}] Mời phỏng vấn vị trí ${jobTitle}|">[Công ty ABC] Mời phỏng vấn vị trí Thực tập sinh Java</title>
</head>
<body>
<div th:fragment="content">
    <p>Xin chào <strong th:text="${studentName}">Nguyễn Văn A</strong>,</p>
    <p><strong th:text="${companyName}">Công ty ABC</strong> trân trọng mời bạn tham gia phỏng vấn vị trí
        <strong th:text="${jobTitle}">Thực tập sinh Java</strong>.</p>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0"
           style="width:100%;margin:16px 0;border:1px solid #e5e7eb;border-radius:6px;">
        <tr>
            <td style="padding:10px 14px;width:150px;color:#6b7280;">Thời gian</td>
            <td style="padding:10px 14px;font-weight:bold;" th:text="${scheduledAt}">09:00 01/12/2026</td>
        </tr>
        <tr>
            <td style="padding:10px 14px;color:#6b7280;border-top:1px solid #e5e7eb;">Hình thức</td>
            <td style="padding:10px 14px;border-top:1px solid #e5e7eb;" th:text="${format}">Trực tuyến</td>
        </tr>
        <tr th:if="${!#strings.isEmpty(destination)}">
            <td style="padding:10px 14px;color:#6b7280;border-top:1px solid #e5e7eb;">Địa điểm / Phòng họp</td>
            <td style="padding:10px 14px;border-top:1px solid #e5e7eb;word-break:break-all;" th:text="${destination}">https://meet.google.com/abc</td>
        </tr>
        <tr th:if="${!#strings.isEmpty(interviewer)}">
            <td style="padding:10px 14px;color:#6b7280;border-top:1px solid #e5e7eb;">Người phỏng vấn</td>
            <td style="padding:10px 14px;border-top:1px solid #e5e7eb;" th:text="${interviewer}">Anh C</td>
        </tr>
        <tr th:if="${!#strings.isEmpty(notes)}">
            <td style="padding:10px 14px;color:#6b7280;border-top:1px solid #e5e7eb;">Ghi chú</td>
            <td style="padding:10px 14px;border-top:1px solid #e5e7eb;white-space:pre-line;" th:text="${notes}">Mang theo CV</td>
        </tr>
    </table>
    <div th:replace="~{email/components :: button(${actionUrl}, 'Xem lịch phỏng vấn')}"></div>
    <p>Chúc bạn phỏng vấn thành công!</p>
</div>
</body>
</html>
