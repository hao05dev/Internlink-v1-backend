<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="email(emailTitle, emailContent)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${emailTitle}">InternLink</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f5f9;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f5f9;padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
                   style="width:100%;max-width:600px;background-color:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e5e7eb;">
                <tr>
                    <td style="background-color:#1d4ed8;padding:20px 32px;">
                        <a th:href="${baseUrl}" href="#" style="color:#ffffff;font-size:22px;font-weight:bold;text-decoration:none;">InternLink</a>
                        <div style="color:#dbeafe;font-size:12px;margin-top:4px;">Cổng thông tin Thực tập tốt nghiệp</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;font-size:15px;line-height:1.6;color:#1f2937;">
                        <div th:replace="${emailContent}">Nội dung email</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 32px;background-color:#f9fafb;border-top:1px solid #e5e7eb;font-size:12px;line-height:1.5;color:#6b7280;">
                        Đây là email tự động từ hệ thống InternLink, vui lòng không trả lời email này.<br>
                        &copy; <span th:text="${year}">2026</span>
                        <a th:href="${baseUrl}" th:text="${baseUrl}" href="#" style="color:#6b7280;">InternLink</a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
