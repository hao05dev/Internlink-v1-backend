<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: email(~{::title}, ~{::content})}">
<head>
    <title>[InternLink] Yêu cầu đặt lại mật khẩu</title>
</head>
<body>
<div th:fragment="content">
    <p>Xin chào <strong th:text="${fullName}">Nguyễn Văn A</strong>,</p>
    <p>Bạn vừa gửi yêu cầu đặt lại mật khẩu tại hệ thống InternLink.
        Nhấn nút bên dưới để tạo mật khẩu mới. Liên kết có hiệu lực trong
        <strong th:text="|${ttlMinutes} phút|">30 phút</strong>.</p>
    <div th:replace="~{email/components :: button(${resetUrl}, 'Đặt lại mật khẩu')}"></div>
    <div th:replace="~{email/components :: fallback(${resetUrl})}"></div>
    <p>Nếu bạn không thực hiện yêu cầu này, vui lòng bỏ qua email. Mật khẩu hiện tại của bạn vẫn giữ nguyên.</p>
</div>
</body>
</html>
