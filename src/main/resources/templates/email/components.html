<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Nút hành động chính (CTA) -->
<table th:fragment="button(url, label)" role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
    <tr>
        <td style="background-color:#1d4ed8;border-radius:6px;">
            <a th:href="${url}" th:text="${label}" href="#"
               style="display:inline-block;padding:12px 28px;color:#ffffff;font-size:15px;font-weight:bold;text-decoration:none;">Mở InternLink</a>
        </td>
    </tr>
</table>

<!-- Link dự phòng khi nút không hiển thị -->
<p th:fragment="fallback(url)" style="font-size:13px;color:#6b7280;word-break:break-all;">
    Nếu nút không hoạt động, hãy sao chép liên kết sau vào trình duyệt:<br>
    <a th:href="${url}" th:text="${url}" href="#" style="color:#1d4ed8;">https://internlink</a>
</p>
</body>
</html>
