name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: mvn verify (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Các test *PostgresTest cần INTERNLINK_TEST_PG_URL nên tự bỏ qua ở đây;
    # phần còn lại chạy trên H2 và không cần biến môi trường nào.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7
