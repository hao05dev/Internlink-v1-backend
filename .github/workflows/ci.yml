name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: mvn verify (JDK 21, H2 + PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Phần lớn test chạy trên H2. Các lớp *PostgresTest chỉ chạy khi có
    # INTERNLINK_TEST_PG_URL: mỗi lớp tạo database riêng và chạy toàn bộ
    # migration Flyway trên PostgreSQL 16 + pgvector thật.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: internlink_test
          POSTGRES_DB: internlink_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U internlink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      INTERNLINK_TEST_PG_URL: jdbc:postgresql://localhost:5432/internlink_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7
